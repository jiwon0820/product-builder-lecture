<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>동물상 테스트 - 나는 강아지상? 고양이상?</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body>
    <header class="top-nav">
        <button id="theme-toggle" class="icon-btn" title="다크 모드 전환">
            <span class="mode-icon">🌙</span>
        </button>
    </header>

    <main class="container">
        <section class="card">
            <header class="card-header">
                <h1 class="title">동물상 테스트</h1>
                <p class="subtitle">사진을 통해 당신의 동물상을 확인해보세요!</p>
            </header>

            <div class="test-content">
                <!-- 이미지 프리뷰 영역 (원형) -->
                <div id="image-preview-area" class="preview-circle">
                    <img id="preview-image" src="" alt="Preview" style="display: none;">
                    <div id="upload-label" class="upload-placeholder">
                        <span class="icon">📁</span>
                        <p>사진 올리기</p>
                    </div>
                </div>

                <!-- 숨겨진 파일 인풋 -->
                <input type="file" id="image-upload" accept="image/*" hidden>

                <div class="controls">
                    <button type="button" id="start-btn" class="primary-btn mint">
                        테스트 시작하기
                    </button>
                    <a href="index.html" class="link-btn">메인으로 돌아가기</a>
                </div>

                <div id="label-container" class="result-labels">
                    <!-- 결과 표시 영역 -->
                </div>
            </div>
        </section>
    </main>

    <footer class="footer">
        <p>&copy; 2026 Animal Face Test. Powered by Teachable Machine.</p>
    </footer>

    <!-- TensorFlow.js & Teachable Machine -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>
    <script src="main.js"></script>
</body>
</html>
