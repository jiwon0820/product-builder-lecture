<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>동물상 테스트 - 나는 강아지상? 고양이상?</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@100..900&display=swap" rel="stylesheet">
</head>
<body>
    <div class="noise-overlay"></div>
    
    <main class="container">
        <header class="header">
            <h1 class="title">동물상 테스트 - 나는 강아지상? 고양이상?</h1>
            <p class="subtitle">AI가 당신의 얼굴을 분석하여 가장 닮은 동물을 알려드립니다.</p>
        </header>

        <section class="test-area">
            <div id="webcam-container" class="webcam-wrapper">
                <div class="webcam-placeholder">
                    <span class="icon">📷</span>
                    <p>카메라를 시작해주세요</p>
                </div>
            </div>
            
            <div class="controls">
                <button type="button" id="start-btn" class="primary-btn">
                    <span class="btn-text">테스트 시작하기</span>
                    <span class="btn-glow"></span>
                </button>
            </div>

            <div id="label-container" class="result-labels">
                <!-- 결과가 여기에 실시간으로 표시됩니다 -->
            </div>
        </section>

        <footer class="footer">
            <p>&copy; 2026 Animal Face Test. Powered by Teachable Machine.</p>
        </footer>
    </main>

    <!-- TensorFlow.js & Teachable Machine Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>
    <script src="main.js"></script>
</body>
</html>
