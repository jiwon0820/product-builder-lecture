<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>오늘 뭐 먹지? - 저녁 메뉴 추천</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&family=Poppins:wght@600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="header-right">
        <a href="#" id="partnership-btn" class="lang-link">🤝 제휴 문의</a>
        <a href="en.html" class="lang-link">English</a>
        <button id="theme-toggle-btn">다크 모드</button>
    </div>

    <div class="main-content">
        <div class="container">
            <div class="header">
                <h1>🍴 오늘 뭐 먹지?</h1>
            </div>
            <div id="menu-display-area">
                <menu-recommendation></menu-recommendation>
            </div>
            <button id="generate-btn">메뉴 추천받기!</button>
        </div>

        <!-- Disqus 댓글 섹션 -->
        <div class="comments-section">
            <h3 class="comments-title">💬 <span class="disqus-comment-count" data-disqus-url="https://jiwon0820.github.io/product-builder-lecture/index.html">댓글 확인 중...</span></h3>
            <div id="disqus_thread"></div>
            <script>
                (function() {
                var d = document, s = d.createElement('script');
                s.src = 'https://productbuilder-db7cem8yte.disqus.com/embed.js';
                s.setAttribute('data-timestamp', +new Date());
                (d.head || d.body).appendChild(s);
                })();
            </script>
            <!-- 카운트 스크립트 추가 -->
            <script id="dsq-count-scr" src="https://productbuilder-db7cem8yte.disqus.com/count.js" async></script>
            <noscript>Please enable JavaScript to view the <a href="https://disqus.com/?ref_noscript">comments powered by Disqus.</a></noscript>
        </div>
    </div>

    <!-- 제휴 문의 모달 -->
    <div id="partnership-modal" class="modal">
        <div class="modal-content container">
            <span class="close-btn">&times;</span>
            <h2>🤝 제휴 문의</h2>
            <p>맛있는 제안을 기다리고 있습니다.</p>
            <form action="https://formspree.io/f/xjgaoqjb" method="POST">
                <div class="form-group">
                    <label for="name">성함/업체명</label>
                    <input type="text" name="name" id="name" required placeholder="예: 홍길동 / 식당이름">
                </div>
                <div class="form-group">
                    <label for="email">이메일 주소</label>
                    <input type="email" name="_replyto" id="email" required placeholder="example@email.com">
                </div>
                <div class="form-group">
                    <label for="message">문의 내용</label>
                    <textarea name="message" id="message" required placeholder="제휴 제안 내용을 입력해주세요."></textarea>
                </div>
                <button type="submit" id="submit-btn">문의하기</button>
            </form>
        </div>
    </div>

    <script src="main.js"></script>
</body>
</html>
