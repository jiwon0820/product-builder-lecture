<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>What's for Dinner? - Menu Recommendation</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&family=Poppins:wght@600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="header-right">
        <a href="#" id="partnership-btn" class="lang-link">🤝 Partnership</a>
        <a href="index.html" class="lang-link">한국어</a>
        <button id="theme-toggle-btn">Dark Mode</button>
    </div>

    <div class="main-content">
        <div class="container">
            <div class="header">
                <h1>🍴 What's for Dinner?</h1>
            </div>
            <div id="menu-display-area">
                <menu-recommendation></menu-recommendation>
            </div>
            <button id="generate-btn">Recommend me a menu!</button>
        </div>

        <!-- Disqus Comment Section -->
        <div class="comments-section">
            <h3 class="comments-title">💬 <span class="disqus-comment-count" data-disqus-url="https://jiwon0820.github.io/product-builder-lecture/en.html"></span></h3>
            <div id="disqus_thread"></div>
            <script>
                (function() {
                var d = document, s = d.createElement('script');
                s.src = 'https://productbuilder-db7cem8yte.disqus.com/embed.js';
                s.setAttribute('data-timestamp', +new Date());
                (d.head || d.body).appendChild(s);
                })();
            </script>
            <!-- Count Script Added -->
            <script id="dsq-count-scr" src="https://productbuilder-db7cem8yte.disqus.com/count.js" async></script>
            <noscript>Please enable JavaScript to view the <a href="https://disqus.com/?ref_noscript">comments powered by Disqus.</a></noscript>
        </div>
    </div>

    <!-- Partnership Inquiry Modal -->
    <div id="partnership-modal" class="modal">
        <div class="modal-content container">
            <span class="close-btn">&times;</span>
            <h2>🤝 Partnership Inquiry</h2>
            <p>We're looking forward to your suggestions.</p>
            <form action="https://formspree.io/f/xjgaoqjb" method="POST">
                <div class="form-group">
                    <label for="name">Name / Company</label>
                    <input type="text" name="name" id="name" required placeholder="Ex: John Doe / Restaurant Name">
                </div>
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" name="_replyto" id="email" required placeholder="example@email.com">
                </div>
                <div class="form-group">
                    <label for="message">Message</label>
                    <textarea name="message" id="message" required placeholder="Please describe your proposal."></textarea>
                </div>
                <button type="submit" id="submit-btn">Send Inquiry</button>
            </form>
        </div>
    </div>

    <script src="main.js"></script>
</body>
</html>
